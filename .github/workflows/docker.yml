# Builds the Docker image, without pushing it, when a pull request or a push to dev
# changes what the image build depends on besides the source: the Dockerfile, the build
# context filter, the manifests, the vendored crates and the dashboard that the binary
# embeds (ui/dist, read by crates/hr-server/build.rs). release.yml builds the same image
# before every release; this catches a Dockerfile that misses a new input before a tag
# does.
# One run per change: pushes to dev, and pull requests through `pull_request` only.
# Runs are grouped per pull request (or per ref outside one), and a newer push cancels the
# older run.
name: docker

on:
  push:
    branches: [dev]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**
      - ui/dist/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - vendor/**
      - ui/dist/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The build, smoke test and size gate of the docker job in release.yml, on the same
  # runner image and with the same (default) build arguments and platform.
  image:
    name: docker image (not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t hyper-router:ci .
      - name: Smoke test
        run: docker run --rm hyper-router:ci --version
      - name: Size gate
        run: bench/gate.sh image hyper-router:ci
