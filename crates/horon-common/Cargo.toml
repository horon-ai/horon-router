[package]
name = "horon-common"
description = "Provider-neutral request helpers shared by translators and executors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
horon-core.workspace = true
http.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
gjson = "0.8.1"
base64 = "0.22"
sha2 = "0.10"
memchr = "2"
# The Go JSON wire layer (gojson): byte strings, RFC 3339 and standard base64.
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The idle signal (idle.rs).
tokio.workspace = true

[dev-dependencies]
flate2 = "1"
