[package]
name = "hr-differential-driver"
version = "0.1.0"
edition = "2024"
publish = false

# Separate workspace: ordinary workspace tests never require Go or namespaces.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8.9"
hr-core = { path = "../../crates/hr-core" }
hr-exec = { path = "../../crates/hr-exec" }
hr-server = { path = "../../crates/hr-server" }
tokio = { version = "1.53", features = ["full"] }
wreq = { version = "=6.0.0-rc.31", features = ["stream", "json"] }

# The same patched gjson as the main workspace (vendor/README.md).
[patch.crates-io]
gjson = { path = "../../vendor/gjson" }
